<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Liquid Showcase</title>
  <style>
    *, *::before, *::after { margin: 0; padding: 0; box-sizing: border-box; }
    html, body { width: 100%; height: 100%; overflow-x: hidden; background: #0a0a0a; color: #e0e0e0; font-family: system-ui, sans-serif; }
    #canvas-container { position: fixed; top: 0; left: 0; width: 100%; height: 100%; z-index: 1; }
    canvas { display: block; width: 100%; height: 100%; }
    #scroll-container { position: relative; z-index: 2; }
    .section { min-height: 100vh; display: flex; align-items: center; justify-content: center; padding: 2rem; }
    #debug-overlay { position: fixed; top: 10px; right: 10px; z-index: 100; background: rgba(0,0,0,0.7); color: #0f0; padding: 8px 12px; font-family: monospace; font-size: 12px; border-radius: 4px; display: none; pointer-events: none; }
    #debug-overlay.visible { display: block; }
    #loading-screen { position: fixed; top: 0; left: 0; width: 100%; height: 100%; z-index: 200; background: #0a0a0a; display: flex; align-items: center; justify-content: center; flex-direction: column; transition: opacity 0.5s ease; }
    #loading-screen.hidden { opacity: 0; pointer-events: none; }
    #loading-bar { width: 200px; height: 3px; background: #333; border-radius: 2px; margin-top: 1rem; overflow: hidden; }
    #loading-progress { width: 0%; height: 100%; background: #e0e0e0; transition: width 0.3s ease; }
    #loading-text { font-size: 14px; color: #888; letter-spacing: 0.1em; text-transform: uppercase; }
  </style>
</head>
<body>
  <div id="loading-screen">
    <div id="loading-text">Loading</div>
    <div id="loading-bar"><div id="loading-progress"></div></div>
  </div>

  <div id="canvas-container">
    <canvas id="webgl-canvas"></canvas>
  </div>

  <div id="scroll-container">
    <section class="section" id="hero">
      <h1 style="font-size: clamp(2rem, 6vw, 5rem); text-align: center; font-weight: 300; letter-spacing: -0.02em;">Liquid</h1>
    </section>
    <section class="section" id="morph"></section>
    <section class="section" id="flow"></section>
    <section class="section" id="palette"></section>
    <section class="section" id="contact"></section>
  </div>

  <div id="debug-overlay"></div>

  <script type="module" src="/src/main.js"></script>
</body>
</html>
